name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.8.6
      # Replaces the previous "lint" job, which was a hand-maintained list of
      # `python -m py_compile` calls. That checked syntax, not lint, and its list named
      # four modules that no longer execute while omitting app/services/ entirely — the
      # package where the running code actually lives. F401 alone would have surfaced most
      # of the dead-code findings that prompted this rewrite.
      - run: ruff check app eval scripts tests
      - run: ruff format --check app eval scripts tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      # pytest was removed from CI in commit 9a5d2b4 ("robust CI - remove pytest
      # dependency"). The suite has been red on main ever since, which is why a broken
      # /ops/metrics shipped with a passing build badge. It is the first gate now.
      - run: pytest -q --cov=app --cov-report=term-missing
      - name: Fail if coverage regressed below floor
        run: pytest -q --cov=app --cov-fail-under=55

  retrieval-eval:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - name: Rebuild the label set and check it is committed in sync
        run: |
          python eval/build_labels.py
          git diff --exit-code eval/labels.json \
            || (echo "eval/labels.json is out of sync with build_labels.py" && exit 1)
      - name: Evaluate retrieval against graded judgements
        run: python eval/harness.py --mode hybrid --k 5
      - name: Assert nDCG has not regressed
        run: |
          python - <<'PY'
          import json, sys
          # Floor, not a target. Set below the measured value with headroom so ordinary
          # variation does not fail the build, while a real regression does.
          FLOOR = 0.70
          results = json.load(open("docs/eval_results.json"))
          ndcg = results["configurations"][0]["metrics"]["ndcg@5"]
          print(f"nDCG@5 = {ndcg} (floor {FLOOR})")
          sys.exit(0 if ndcg >= FLOOR else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: docs/eval_results.json

  benchmark:
    name: Latency regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      # Thresholds are deliberately loose: this catches order-of-magnitude regressions
      # (a cache removed, an accidental O(n^2), a model loaded per request), not laptop-
      # specific numbers. Cold and warm are measured separately.
      - run: python scripts/benchmark.py --assert --iterations 100
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: docs/benchmark_results.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t talentra-copilot:ci .
      - name: Smoke the built image
        run: |
          docker run -d --name talentra -p 8000:8000 talentra-copilot:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break || sleep 2
          done
          curl -fsS http://localhost:8000/ops/build | tee /dev/stderr | grep -q '"langgraph_available": *true'
          docker rm -f talentra
